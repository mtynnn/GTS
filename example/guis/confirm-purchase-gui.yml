title: '&0Comprando %item%'
# a gui can have 1-6 rows
rows: 1
# valid values: CHEST, WORKBENCH, HOPPER, DISPENSER, BREWING
type: CHEST

# ----- ITEMS -----

confirm:
  slot:
  - 0
  - 1
  - 2
  - 3
  material: LIME_STAINED_GLASS_PANE
  name: '&#33FF33ᴄᴏɴғɪʀᴍᴀʀ'
