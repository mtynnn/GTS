  - ' '
  - ' &f¿Estás seguro de que quieres comprar el item?'
  - ' &f¡Esta acción es irreversible!'
  - ' '
  - '&#33FF33→ Click para comprar item'
  actions:
  - '[SOUND] ui.button.click|1|1'

item:
  slot: 4

cancel:
  slot:
  - 5
  - 6
  - 7
  - 8
  material: RED_STAINED_GLASS_PANE
  name: '&#FF3333ᴄᴀɴᴄᴇʟᴀʀ'
  lore:
  - ' '
  - ' &f¡Haz click aquí para volver al menú de subastas!'
  - ' '
  - '&#FF3333→ Click para cancelar compra'
  actions:
  - '[SOUND] ui.button.click|1|1'

