time:
  second: s
  minute: m
  hour: h
  day: d

sorting:
  newest: Newest to oldest
  oldest: Oldest to newest
  cheapest: Cheapest to priciest
  priciest: Priciest to cheapest

currency:
  # used for the %selected_currency% placeholder when none is selected
  no-currency: All

sell:
  limit-reached: '&#FF0000¡Has alcanzado el límite de subastas! &7(%current%/%limit%)'
  no-item: '&#FF0000¡Sostenemos algo en tu mano para venderlo!'
  no-currency: '&#FF0000¡Debes proporcionar un parámetro de moneda!'
  price-too-low: '&#FF0000¡El precio que estableciste está por debajo del mínimo de &f%amount%&#FF0000!'
  price-too-high: '&#FF0000¡El precio que estableciste está por encima del máximo de &f%amount%&#FF0000!'
  invalid-price: '&#FF0000¡El precio que estableciste no es un número válido!'
  success: '&#33FF33¡Has puesto exitosamente &f%amount% &#33FF33items en la casa de subastas por &f%price%&#33FF33!'
  # set to "" to disable
  # these will be shown to all players
  action-bar-broadcast: ''
  chat-broadcast: ''

buy:
  not-enough-money: '&#FF0000¡No puedes permitirte este item!'
  item-not-found: '&#FF0000¡El item no se encontró! Alguien debe haberlo comprado o el vendedor lo canceló!'
  inventory-full: '&#FF0000¡Tu inventario está lleno!'
  success: '&#33FF33¡Has comprado &f%amount%x %item% &#33FF33de la casa de subastas por &f%price%&#33FF33!'
  # this will be used when there is 0% tax set for the currency
  notify-seller: '&#00DDFF%player% &fha comprado tu &#00DDFF%amount%x &#00DDFF%item% &fpor &#00DDFF%price% &fde la casa de subastas!'
  # this will be used when a tax is set for the currency
  #  %amount% (the original amount)
  #  %tax-amount% (amount after tax)
  #  %tax-percent% (the % of tax on the currency)
  #  %tax-fee% (amount taken because of tax)
  notify-seller-tax: '&#00DDFF%player% &fha comprado tu &#00DDFF%amount%x &#00DDFF%item% &fpor &#00DDFF%price% &#DDDDDD(%tax-amount% después de impuestos) &fde la casa de subastas!'
  # set to "" to disable
  # these will be shown to all players
  action-bar-purchase: ''
  chat-purchase: ''

